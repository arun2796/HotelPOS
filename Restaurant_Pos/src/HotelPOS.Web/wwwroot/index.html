<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#078747" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>HotelPOS</title>
    <base href="/app/" />
    <!-- The shared library's files keep their own base path (_content/...), not this app's "app": the API serves them at
         /_content/... both under dotnet run and after publish (wwwroot/_content). /app/_content/... matches no file and the
         API's authorization fallback answers 401, which left the app unstyled. -->
    <link rel="preload" href="../_content/HotelPOS.Client.Shared/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../_content/HotelPOS.Client.Shared/fonts/Inter-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../_content/HotelPOS.Client.Shared/css/tokens.css" />
    <link rel="stylesheet" href="../_content/HotelPOS.Client.Shared/css/app.css" />
    <link rel="stylesheet" href="../_content/HotelPOS.Client.Shared/css/waiter.css" />
    <link rel="stylesheet" href="../_content/HotelPOS.Client.Shared/css/kitchen.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <div class="splash">
            <div class="splash-logo">HotelPOS</div>
            <div class="splash-text">Loading…</div>
        </div>
    </div>

    <div id="blazor-error-ui" class="error-ui">
        Something went wrong. <a href="." class="reload">Reload</a>
        <span class="dismiss">×</span>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/viewport.js"></script>
    <script src="js/notify.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
